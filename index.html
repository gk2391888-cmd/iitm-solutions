<!DOCTYPE html>
<html>
<head>
<title>IITM Solutions V1.5 - By Gaurav Gupta</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0a0a0f;color:white;font-family:sans-serif;padding:15px}
.card{background:#1a1a2e;padding:15px;border-radius:15px;margin:15px 0}
button{padding:10px 15px;border-radius:20px;border:1px solid #7c3aed;background:#7c3aed;color:white;cursor:pointer;margin:5px}
input,select{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none}
</style>
</head>
<body>

<h1 style="text-align:center;color:#8b5cf6">IITM SOLUTIONS V1.5</h1>
<p style="text-align:center">Crafted by <b>Gaurav Gupta</b> | IITM BS | 28 Users Live</p>

<div class="card">
<h3>📄 PYQ Vault</h3>
<div id="pyqList">Loading...</div>
</div>

<div class="card" style="border:2px dashed #7c3aed">
<h3>🔐 Admin - PYQ Upload (Fixed by Gaurav Gupta)</h3>
<input id="title" placeholder="Title Ex: Stats 1 Quiz 1 2024">
<select id="subject">
<option>Maths 1</option><option>Maths 2</option><option>Stats 1</option><option>Stats 2</option><option>Python</option><option>CT</option>
</select>
<select id="type">
<option>Quiz 1</option><option>Quiz 2</option><option>GA</option><option>End Term</option>
</select>
<input type="file" id="file" accept=".pdf">
<button onclick="upload()" id="btn">Upload PYQ - By Gaurav Gupta</button>
</div>

<script>
const SUPABASE_URL = "Tera_Supabase_URL_Daal"
const SUPABASE_KEY = "Tera_Anon_Key_Daal"
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

async function load(){
  let {data} = await supabase.from('pyqs').select('*').order('created_at',{ascending:false})
  let html=""
  if(data) data.forEach(p=>{
    html+=`<div style="background:#2a2a4a;padding:10px;border-radius:10px;margin:5px 0"><b>${p.subject}</b> - ${p.title} <a href="${p.file_url}" target="_blank" style="float:right">📥</a></div>`
  })
  document.getElementById('pyqList').innerHTML=html||"No PYQ yet"
}
load()

async function upload(){
  let title=document.getElementById('title').value
  let subject=document.getElementById('subject').value
  let type=document.getElementById('type').value
  let file=document.getElementById('file').files[0]
  if(!file||!title) return alert("Title + File daal bhai!")

  document.getElementById('btn').innerText="Uploading..."
  let uniqueName=Date.now()+"_"+subject+"_"+file.name

  let {error:upErr}=await supabase.storage.from('pyqs').upload(uniqueName,file,{upsert:true})
  if(upErr){alert(upErr.message); return}

  let {data:urlData}=supabase.storage.from('pyqs').getPublicUrl(uniqueName)

  let {error:dbErr}=await supabase.from('pyqs').insert([{title,subject,exam_type:type,file_url:urlData.publicUrl,uploaded_by:'Gaurav Gupta'}])
  if(dbErr){alert(dbErr.message)} else {
    alert("✅ "+subject+" Uploaded!")
    document.getElementById('title').value=""; document.getElementById('file').value=""
    load()
  }
  document.getElementById('btn').innerText="Upload PYQ - By Gaurav Gupta"
}
</script>

<p style="text-align:center;color:#666;font-size:12px">Made with ❤️ by Gaurav Gupta | Made in India 🇮🇳</p>
</body>
</html>
