<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
html,body{width:100%;max-width:100vw;overflow-x:hidden!important;position:relative}
body{background:#060a18;color:#e2e8f0}

.header{background:rgba(15,23,42,.98);backdrop-filter:blur(20px);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:100;width:100%;max-width:100vw;box-sizing:border-box}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.logo-iitm{font-weight:900;font-size:21px;background:linear-gradient(90deg,#38bdf8,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}.logo-sol{font-weight:600;font-size:17px;background:linear-gradient(90deg,#38bdf8,#e2e8f0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.tabs{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;position:sticky;top:56px;background:rgba(6,10,24,.98);z-index:90;scrollbar-width:none;width:100%;max-width:100vw;box-sizing:border-box;border-bottom:1px solid rgba(255,255,255,.04)}.tabs::-webkit-scrollbar{display:none}.tab{padding:9px 14px;background:var(--card);border-radius:100px;cursor:pointer;font-weight:700;font-size:11px;white-space:nowrap;border:1px solid var(--border);flex-shrink:0}.tab.active{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff}
.main{max-width:1300px;margin:0 auto;padding:10px;display:grid;grid-template-columns:1fr 360px;gap:12px;padding-bottom:110px;width:100%;max-width:100%;box-sizing:border-box;overflow-x:hidden}
@media(max-width:900px){.main{grid-template-columns:1fr;padding:10px;padding-bottom:110px}.desktop-only{display:none!important}}
.card{background:linear-gradient(180deg,var(--card2) 0%,var(--card) 100%);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:14px;margin-bottom:12px;width:100%;max-width:100%;overflow:hidden;box-sizing:border-box}
#studyTab{min-height:520px;width:100%;overflow:hidden}
.timer{font-size:clamp(32px,11vw,60px);font-weight:900;text-align:center;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:10px auto;letter-spacing:-1px;line-height:1;width:100%;max-width:100%;min-height:60px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.btn{padding:12px 16px;border:none;border-radius:14px;font-weight:800;cursor:pointer;white-space:nowrap}
input,select,textarea{width:100%;max-width:100%;padding:13px 16px;background:#080d1d;border:1px solid var(--border);border-radius:14px;color:white;margin:7px 0;outline:none;font-size:13px;box-sizing:border-box}
.pyq-card{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#111b33;border:1px solid rgba(255,255,255,.06);border-left:4px solid var(--p2);padding:12px;border-radius:14px;margin-bottom:10px;width:100%;max-width:100%;box-sizing:border-box}
.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,16,35,.98);border-top:1px solid rgba(255,255,255,.08);padding:8px 0 14px;z-index:99;justify-content:space-around;width:100%;max-width:100vw;box-sizing:border-box}
.b-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;font-size:10px;opacity:.6;min-width:0}.b-item.active{opacity:1;color:var(--p);background:rgba(56,189,248,.12);border-radius:12px}
.hidden{display:none!important}
</style>
<script>const workerCode=`let t=null;self.onmessage=e=>{if(e.data=='start'){clearInterval(t);t=setInterval(()=>self.postMessage('tick'),1000)}else if(e.data=='stop'){clearInterval(t)}}`;const blob=new Blob([workerCode],{type:'application/javascript'});let timerWorker=null;try{timerWorker=new Worker(URL.createObjectURL(blob))}catch(e){}</script></head><body>

<div id="mainApp" class="hidden"><div class="header"><div class="logo"><img src="icon-48x48.png" style="width:36px;height:36px;border-radius:10px"><div><span class="logo-iitm">IITM</span> <span class="logo-sol">SOLUTIONS</span></div></div><div style="display:flex;gap:8px;align-items:center"><div id="streakBox" style="background:linear-gradient(135deg,#f97316,#ef4444);padding:6px 10px;border-radius:20px;font-size:10px;font-weight:800">🔥 <span id="streakCount">0</span></div><button onclick="logout()" style="background:#1e293b;color:white;padding:8px 12px;border-radius:20px;border:none;font-size:11px">Logout</button></div></div>

<div class="card" id="studyTab"><div style="display:flex;gap:8px;margin-bottom:12px;width:100%"><select id="studySubject" style="flex:1;min-width:0"><option>Foundation</option><option>Maths 1</option><option>Maths 2</option><option>Stats 1</option><option>Stats 2</option><option>Python</option></select><div id="dDayBox" style="background:rgba(239,68,68,.15);color:#ef4444;padding:10px 12px;border-radius:12px;font-size:11px;font-weight:800;white-space:nowrap">D-12 Quiz</div></div><div class="timer" id="time">00:00:00</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button id="startStopBtn" class="btn" style="background:#22c55e;color:white;min-width:100px" onclick="toggleStartStop()">Start</button><button id="pauseResumeBtn" class="btn" style="background:#1e293b;color:white;min-width:100px" onclick="togglePauseResume()">Pause</button><button class="btn" style="background:#1e293b;color:white" onclick="rs()">Reset</button></div><button onclick="save()" style="width:100%;background:linear-gradient(90deg,#38bdf8,#8b5cf6);color:white;margin-top:16px;padding:14px;border-radius:14px;font-weight:800;border:none">Save Session</button></div>
</div><div class="desktop-only"><div class="card"><h3>Leaderboard</h3><div id="board"></div></div></div></div>
