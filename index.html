<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>IITM V4.2 OTP</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#060a18;color:#e2e8f0}
.login-screen{position:fixed;inset:0;background:radial-gradient(ellipse at top,#1e293b,#060a18);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}.login-box{background:#0f172a;border:1px solid #1e293b;border-radius:24px;padding:28px;max-width:420px;width:100%;margin:auto}
.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,16,35,.98);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.08);padding:6px 0 14px;z-index:99;justify-content:space-around}
.b-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:12px;cursor:pointer;font-size:9px;opacity:.6}.b-item.active{opacity:1;color:#38bdf8;background:rgba(56,189,248,.12)}.b-item i{font-size:18px}
@media(min-width:901px){.bottom-nav{display:none!important}}input,select{width:100%;padding:12px 14px;background:#080d1d;border:1px solid #1e293b;border-radius:12px;color:white;margin:6px 0;outline:none}.dob-row{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px}
.card{background:linear-gradient(180deg,#151f3a,#0f172a);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:20px;margin-bottom:14px}
.main{max-width:1300px;margin:0 auto;padding:14px;display:grid;grid-template-columns:1fr 340px;gap:14px;padding-bottom:100px} @media(max-width:900px){.main{grid-template-columns:1fr}}
.timer{font-size:64px;font-weight:800;text-align:center;background:linear-gradient(90deg,#38bdf8,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hidden{display:none!important}#otpModal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:3000;display:none;align-items:center;justify-content:center;padding:16px}#otpModal.open{display:flex}
</style></head><body>
<div id="loginScreen" class="login-screen"><div class="login-box">
<h1 style="text-align:center">IITM <span style="background:linear-gradient(90deg,#38bdf8,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent">SOLUTIONS</span></h1><p style="text-align:center;font-size:10px;opacity:.5;margin-top:4px">V4.2 OTP EDITION</p>
<div id="loginForm" style="margin-top:18px">
<button onclick="googleLogin()" style="width:100%;background:white;color:black;padding:12px;border-radius:12px;border:none;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px"><img src="https://www.svgrepo.com/show/475656/google-color.svg" style="width:18px"> Continue with Google</button>
<div style="text-align:center;margin:12px 0;opacity:.3;font-size:10px">OR</div>
<input id="loginEmail" placeholder="Email"><input id="loginPass" type="password" placeholder="Password">
<button onclick="login()" style="width:100%;background:linear-gradient(90deg,#38bdf8,#8b5cf6);color:white;padding:13px;border-radius:12px;border:none;font-weight:800;margin-top:8px">Login</button>
<div style="display:flex;justify-content:space-between;margin-top:12px;font-size:11px"><span onclick="openOTP()" style="color:#38bdf8;cursor:pointer;font-weight:700">Forgot Password? (OTP)</span><span onclick="toggleAuth()" style="color:#38bdf8;cursor:pointer;font-weight:700">Create Account</span></div>
</div>
<div id="signupForm" class="hidden" style="margin-top:18px">
<input id="regName" placeholder="Full Name"><input id="regEmail" placeholder="Email"><input id="regPass" type="password" placeholder="Password">
<select id="regGender"><option value="">Select Gender</option><option>Male</option><option>Female</option><option>Other</option></select>
<label style="font-size:10px;opacity:.6;margin-top:6px;display:block">DOB - Select (No Calendar)</label>
<div class="dob-row"><select id="regDay"><option>Day</option></select><select id="regMonth"><option value="">Month</option><option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option><option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option><option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option><option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option></select><select id="regYear"><option>Year</option></select></div>
<select id="regAge"><option>Select Age</option></select>
<button onclick="register()" style="width:100%;background:linear-gradient(90deg,#22c55e,#16a34a);color:white;padding:14px;border-radius:12px;border:none;font-weight:800;margin-top:12px">Create Account ✨</button>
<p style="margin-top:12px;font-size:11px;text-align:center"><span onclick="toggleAuth()" style="color:#38bdf8;cursor:pointer">Back to Login</span></p>
</div>
<p id="authStatus" style="font-size:11px;margin-top:12px;text-align:center"></p>
</div></div>

<div id="mainApp" class="hidden"><div style="background:rgba(15,23,42,.9);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,.06)"><div style="font-weight:800">IITM SOLUTIONS</div><div style="display:flex;gap:10px;align-items:center"><img id="userPhoto" style="width:34px;height:34px;border-radius:50%;border:2px solid #38bdf8;display:none"><button onclick="logout()" style="background:#1e293b;color:white;padding:6px 10px;border-radius:20px;border:none">↪</button></div></div>
<div class="main"><div><div class="card"><div class="timer" id="time">00:00:00</div><div style="display:flex;gap:10px;justify-content:center"><button onclick="st()" style="background:#22c55e;color:white;padding:10px 20px;border-radius:12px;border:none;font-weight:800">Start</button><button onclick="sp()" style="background:#1e293b;color:#94a3b8;padding:10px 14px;border-radius:12px;border:none">Pause</button><button onclick="rs()" style="background:#1e293b;color:#94a3b8;padding:10px 14px;border-radius:12px;border:none">Reset</button></div><button onclick="save()" style="width:100%;background:linear-gradient(90deg,#38bdf8,#8b5cf6);color:white;margin-top:16px;padding:13px;border-radius:12px;font-weight:800;border:none">💾 Save</button></div></div><div><div class="card"><h3>🏆 Leaderboard</h3><div id="board"></div></div></div></div>
<div class="bottom-nav"><div class="b-item active"><i class="fa-solid fa-stopwatch"></i><span>Timer</span></div><div class="b-item"><i class="fa-solid fa-file-lines"></i><span>PYQ</span></div><div class="b-item"><i class="fa-solid fa-comments"></i><span>Chat</span></div><div class="b-item"><i class="fa-solid fa-book-open"></i><span>Sols</span></div><div class="b-item"><i class="fa-solid fa-user"></i><span>Profile</span></div></div>
</div>

<!-- OTP MODAL -->
<div id="otpModal"><div style="background:#0f172a;border:1px solid #1e293b;border-radius:20px;padding:24px;max-width:360px;width:100%"><h3>🔑 Reset via OTP</h3><p id="otpStepText" style="font-size:11px;opacity:.6;margin-top:6px">Email pe OTP jayega</p>
<div id="otpStep1" style="margin-top:14px"><input id="resetEmail" placeholder="Your Email"><button onclick="sendOTP()" id="sendBtn" style="width:100%;background:linear-gradient(90deg,#38bdf8,#8b5cf6);color:white;padding:13px;border-radius:12px;border:none;font-weight:800;margin-top:10px">Send OTP 📨</button></div>
<div id="otpStep2" class="hidden" style="margin-top:14px"><input id="otpInput" placeholder="6-digit OTP" maxlength="6" style="text-align:center;letter-spacing:6px;font-size:18px;font-weight:800"><input id="newPassInput" type="password" placeholder="New Password (6+ char)"><button onclick="verifyAndReset()" style="width:100%;background:#22c55e;color:white;padding:13px;border-radius:12px;border:none;font-weight:800;margin-top:10px">Reset Password ✅</button><p id="otpTimer" style="font-size:10px;text-align:center;margin-top:8px;opacity:.6"></p></div>
<p id="otpStatus" style="font-size:11px;text-align:center;margin-top:12px"></p><button onclick="closeOTP()" style="width:100%;background:#1e293b;color:white;padding:10px;border-radius:10px;border:none;margin-top:10px">Cancel</button></div></div>

<script>
// === CONFIG ===
const firebaseConfig={apiKey:"AIzaSyBtugz-3SDbpoH5zOOvQI0AoAb6kbqb0dc",authDomain:"iitm-solutions.firebaseapp.com",databaseURL:"https://iitm-solutions-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"iitm-solutions",storageBucket:"iitm-solutions.firebasestorage.app",messagingSenderId:"411649171402",appId:"1:411649171402:web:e5278ba01a518080b0b933"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const auth=firebase.auth();

// EmailJS - TUJHE SIRF 2 MIN ME SETUP KARNA HAI
// emailjs.com pe jake free account bana, Service + Template bana le
// Yaha keys daal de - abhi demo ke liye chalega
emailjs.init("YOUR_PUBLIC_KEY"); // <-- Yaha apna public key daal

let sec=0,iv=null;function upd(){let h=String(Math.floor(sec/3600)).padStart(2,'0'),m=String(Math.floor(sec%3600/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');document.getElementById('time').innerText=h+':'+m+':'+s;}function st(){if(iv)return;iv=setInterval(()=>{sec++;upd();},1000);}function sp(){clearInterval(iv);iv=null;}function rs(){sp();sec=0;upd();}function save(){if(sec<10){alert('10 sec min');return;}sp();let u=JSON.parse(localStorage.getItem('iitm_user')||'{}');db.ref('leaderboard').push({name:u.name||'User',time:sec});rs();alert('Saved!');}
(function(){let d=document.getElementById('regDay');for(let i=1;i<=31;i++){let o=document.createElement('option');o.value=i;o.text=i;d.appendChild(o);}let y=document.getElementById('regYear');for(let i=2008;i>=1980;i--){let o=document.createElement('option');o.value=i;o.text=i;y.appendChild(o);}let a=document.getElementById('regAge');for(let i=15;i<=60;i++){let o=document.createElement('option');o.value=i;o.text=i+' years';a.appendChild(o);}})();
function toggleAuth(){document.getElementById('loginForm').classList.toggle('hidden');document.getElementById('signupForm').classList.toggle('hidden');}
async function register(){let n=document.getElementById('regName').value.trim(),e=document.getElementById('regEmail').value.trim().toLowerCase(),p=document.getElementById('regPass').value;let gender=document.getElementById('regGender').value,day=document.getElementById('regDay').value,month=document.getElementById('regMonth').value,year=document.getElementById('regYear').value,age=document.getElementById('regAge').value;if(!n||!e||p.length<6||!gender||!day||!month||!year||!age){document.getElementById('authStatus').innerText='❌ All fields required';return;}let dob=day+'/'+month+'/'+year;let s=await db.ref('users').orderByChild('email').equalTo(e).once('value');if(s.exists()){document.getElementById('authStatus').innerText='❌ Exists';return;}let u=db.ref('users').push();await u.set({name:n,email:e,pass:btoa(p),gender:gender,dob:dob,age:age,created:Date.now()});document.getElementById('authStatus').innerText='✅ Created! Login';toggleAuth();}
async function login(){let e=document.getElementById('loginEmail').value.trim().toLowerCase(),p=document.getElementById('loginPass').value;if(e==='admin@iitm.com'&&p==='admin123'){localStorage.setItem('iitm_user',JSON.stringify({name:'Gaurav Gupta',email:e}));localStorage.setItem('iitm_admin','true');showApp();return;}let s=await db.ref('users').orderByChild('email').equalTo(e).once('value');if(!s.exists()){document.getElementById('authStatus').innerText='❌ Not found';return;}let f=null;s.forEach(c=>{let d=c.val();d._key=c.key;if(atob(d.pass)===p)f=d;});if(!f){document.getElementById('authStatus').innerText='❌ Wrong pass';return;}localStorage.setItem('iitm_user',JSON.stringify(f));localStorage.setItem('iitm_userKey',f._key);showApp();}
function googleLogin(){let provider=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(provider).then(async res=>{let u=res.user;let email=u.email.toLowerCase();let name=u.displayName;let photo=u.photoURL;let snap=await db.ref('users').orderByChild('email').equalTo(email).once('value');let key=null;if(!snap.exists()){let nu=db.ref('users').push();await nu.set({name:name,email:email,pass:'google',photo:photo,created:Date.now()});key=nu.key;}else{snap.forEach(c=>{key=c.key;});}localStorage.setItem('iitm_user',JSON.stringify({name:name,email:email}));localStorage.setItem('iitm_userKey',key);localStorage.setItem('iitm_userPhoto',photo);showApp();});}
function showApp(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');let photo=localStorage.getItem('iitm_userPhoto');if(photo){let img=document.getElementById('userPhoto');img.src=photo;img.style.display='block';}}
function logout(){localStorage.clear();location.reload();}
window.onload=()=>{let u=localStorage.getItem('iitm_user');if(u)showApp();};

// === OTP SYSTEM ===
function openOTP(){document.getElementById('otpModal').classList.add('open');document.getElementById('otpStep1').classList.remove('hidden');document.getElementById('otpStep2').classList.add('hidden');document.getElementById('otpStatus').innerText='';}
function closeOTP(){document.getElementById('otpModal').classList.remove('open');}
function sendOTP(){
 let email=document.getElementById('resetEmail').value.trim().toLowerCase();
 if(!email){document.getElementById('otpStatus').innerText='❌ Email daal';return;}
 document.getElementById('sendBtn').innerText='⏳ Sending...';document.getElementById('sendBtn').disabled=true;
 db.ref('users').orderByChild('email').equalTo(email).once('value').then(snap=>{
  if(!snap.exists() && email!=='admin@iitm.com'){document.getElementById('otpStatus').innerText='❌ Email not found';document.getElementById('sendBtn').innerText='Send OTP 📨';document.getElementById('sendBtn').disabled=false;return;}
  let otp=Math.floor(100000+Math.random()*900000).toString();
  let expiry=Date.now()+5*60*1000;
  let safeEmail=email.replace(/\./g,'_').replace(/@/g,'_at_');
  db.ref('password_resets/'+safeEmail).set({email:email,otp:otp,expiry:expiry}).then(()=>{
   // TRY EmailJS - agar key nahi hai to demo OTP dikhayega
   emailjs.send("service_iitm","template_otp",{to_email:email,otp:otp,to_name:email}).then(()=>{
     document.getElementById('otpStatus').innerHTML=`✅ OTP sent to <b>${email}</b><br>Check inbox/spam`;
   }).catch(()=>{
     document.getElementById('otpStatus').innerHTML=`✅ OTP Generated!<br>Demo OTP: <b style="color:#22c55e;font-size:18px">${otp}</b><br><small>EmailJS key daalne ke baad email pe jayega</small>`;
     alert(`DEMO OTP for ${email}: ${otp}`);
   });
   document.getElementById('otpStep1').classList.add('hidden');document.getElementById('otpStep2').classList.remove('hidden');
   document.getElementById('sendBtn').innerText='Send OTP 📨';document.getElementById('sendBtn').disabled=false;
   let t=300;let timer=setInterval(()=>{t--;let m=Math.floor(t/60),s=t%60;document.getElementById('otpTimer').innerText=`⏳ ${m}:${String(s).padStart(2,'0')} left`;if(t<=0){clearInterval(timer);document.getElementById('otpTimer').innerText='❌ Expired';}},1000);
  });
 });
}
function verifyAndReset(){
 let email=document.getElementById('resetEmail').value.trim().toLowerCase();
 let otpIn=document.getElementById('otpInput').value.trim();
 let newPass=document.getElementById('newPassInput').value.trim();
 if(otpIn.length!==6||newPass.length<6){document.getElementById('otpStatus').innerText='❌ OTP 6 digit + Pass 6+ char';return;}
 let safeEmail=email.replace(/\./g,'_').replace(/@/g,'_at_');
 db.ref('password_resets/'+safeEmail).once('value').then(snap=>{
  if(!snap.exists()){document.getElementById('otpStatus').innerText='❌ No OTP';return;}
  let d=snap.val();if(Date.now()>d.expiry){document.getElementById('otpStatus').innerText='❌ Expired';return;}
  if(d.otp!==otpIn){document.getElementById('otpStatus').innerText='❌ Wrong OTP';return;}
  if(email==='admin@iitm.com'){document.getElementById('otpStatus').innerText='❌ Admin cant reset';return;}
  db.ref('users').orderByChild('email').equalTo(email).once('value').then(uSnap=>{
   uSnap.forEach(child=>{db.ref('users/'+child.key).update({pass:btoa(newPass)}).then(()=>{db.ref('password_resets/'+safeEmail).remove();document.getElementById('otpStatus').innerText='✅ Reset done! Login karo';setTimeout(()=>{closeOTP();document.getElementById('authStatus').innerText='✅ Pass changed, login';},1200);});});
  });
 });
}
db.ref('leaderboard').on('value',s=>{let a=[];s.forEach(c=>a.push(c.val()));a.sort((x,y)=>y.time-x.time);a=a.slice(0,10);let b=document.getElementById('board');if(!b)return;b.innerHTML='';a.forEach((d,i)=>{b.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:8px;background:#0f172a;border-radius:10px;margin-bottom:6px;font-size:12px"><span>${i+1}. ${d.name}</span><span>${Math.floor(d.time/60)}m</span></div>`})});
</script></body></html>
