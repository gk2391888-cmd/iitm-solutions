-radius:12px;margin:10px 0"><input id="pyqTitle" placeholder="Title"><input id="pyqLink" placeholder="Link"><select id="pyqSub"><option>Maths 1</option></select><select id="pyqType"><option>Quiz 1</option></select><button id="pyqAddBtn" onclick="addPYQ()" style="width:100%;background:#8b5cf6;color:white;padding:10px;border-radius:8px;border:none;margin-top:6px">Add</button><button id="pyqCancelBtn" onclick="cancelPYQEdit()" style="display:none">Cancel</button></div><div id="pyqList"></div></div><div class="card" id="notesTab" style="display:none"><h3>Notes - <span id="totalNotesCount">0</span></h3><div id="adminNotesBox" class="hidden"><input id="notesTitle" placeholder="Title"><input id="notesLink" placeholder="Link"><select id="notesSub"><option>Maths 1</option></select><select id="notesType"><option>Quiz 1</option></select><button id="notesAddBtn" onclick="addNotes()" style="width:100%;background:#22c55e;color:white;padding:10px;border-radius:8px;border:none">Share</button><button id="notesCancelBtn" onclick="cancelNotesEdit()" style="display:none">Cancel</button></div><div id="notesList"></div></div><div class="card" id="solsTab" style="display:none"><h3>Sols - <span id="solCount">0</span></h3><select id="subjectFilter" onchange="filterSols()"><option value="All">All</option></select><select id="solTypeFilter" onchange="filterSols()"><option value="All">All</option></select><div id="adminSolBox" class="hidden"><input id="solTitle" placeholder="Title"><input id="solLink" placeholder="Link"><select id="solSub"><option>Maths 1</option></select><select id="solType"><option>Quiz 1</option></select><button id="solAddBtn" onclick="addSolution()" style="width:100%;background:#38bdf8;color:white;padding:10px;border-radius:8px;border:none">Upload</button><button id="solCancelBtn" onclick="cancelSolEdit()" style="display:none">Cancel</button></div><div id="solutionsList"></div></div><div class="card" id="savedTab" style="display:none"><h3>Saved</h3><div id="savedList"></div></div><div class="card" id="supportTab" style="display:none"><h3>Support</h3><select id="ticketCategory"><option>Login Issue</option><option>Other</option></select><input id="ticketSubject" placeholder="Subject"><textarea id="ticketMessage" placeholder="Message"></textarea><button onclick="submitTicket()" style="width:100%;background:#38bdf8;color:white;padding:12px;border-radius:10px;border:none">Submit</button><div id="myTicketsList"></div><div id="adminSupportBox" class="hidden"><div id="allTicketsList"></div></div></div><div class="card" id="adminTab" style="display:none"><h3>Admin</h3><div id="boardMobile"></div><div id="board"></div><div id="totalUsers">0</div><div id="totalPYQ">0</div><div id="totalNotes">0</div><div id="totalSols">0</div><input id="newAdminEmail" placeholder="Email"><button onclick="makeAdminByEmail()">Make Admin</button><button onclick="removeAdminByEmail()">Remove</button><div id="adminList"></div><div id="usersList"></div><input id="dDayTitle" placeholder="Title"><input id="dDayDate" type="date"><button onclick="setDDay()">Set D-Day</button><div id="dDayBox">D-12</div><div id="chatBox"></div><input id="chat"><button onclick="send()">Send</button><span id="chatCount">0</span><div id="adminChatControls" class="hidden"></div></div><div class="card" id="calcTab" style="display:none"></div><div class="card" id="boardMTab" style="display:none"></div></div></div><div id="profileModal"><div style="background:#0f172a;padding:22px;border-radius:22px;max-width:400px;width:100%"><h3>Profile</h3><input id="pName"><select id="pGender"><option>Male</option></select><select id="pDay"></select><select id="pMonth"></select><select id="pYear"></select><textarea id="pBio"></textarea><button onclick="saveProfile()" style="width:100%;background:#38bdf8;color:white;padding:12px;border-radius:10px;border:none">Save</button><button onclick="closeProfile()">Close</button><p id="profileStatus"></p><img id="profilePic" style="width:80px;height:80px;border-radius:50%"><p id="profileEmail"></p></div></div><div id="otpModal"><div style="background:#0f172a;padding:24px;border-radius:22px;max-width:380px;width:100%"><h3>OTP Reset</h3><div id="otpStep1"><input id="resetEmail" placeholder="Email"><button onclick="sendOTP()" id="sendBtn" style="width:100%;background:#38bdf8;color:white;padding:12px;border-radius:10px;border:none">Send OTP</button></div><div id="otpStep2" class="hidden"><input id="otpInput" placeholder="OTP"><input id="newPassInput" type="password" placeholder="New Pass"><button onclick="verifyAndReset()" style="width:100%;background:#22c55e;color:white;padding:12px;border-radius:10px;border:none">Verify</button><button onclick="backToEmail()">Back</button></div><p id="otpStatus"></p><button onclick="closeOTP()">Close</button></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyDSt8H43XQZFUF7MRuIqDq8Cdk4ZClwEDc",authDomain:"iitm-solutions.firebaseapp.com",databaseURL:"https://iitm-solutions-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"iitm-solutions",storageBucket:"iitm-solutions.firebasestorage.app",messagingSenderId:"411649171402",appId:"1:411649171402:web:e5278ba01a518080b0b933"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const auth=firebase.auth();emailjs.init({publicKey:"0g35NzGfXah-1DMhS"});const SERVICE_ID="service_q3nz8on",TEMPLATE_ID="template_otvm3vh";
let currentUser=null,isAdmin=false,sec=0,iv=null,allSols=[],allPYQ=[],allNotes=[],currentBoardFilter='total',startTimestamp=0,allLeaderData=[],studyingCache={},isPaused=false,pendingSignupData=null,bookmarks=JSON.parse(localStorage.getItem('bookmarks')||'[]'),allTickets=[],editPYQId=null,editNoteId=null,editSolId=null;
function toggleAuth(){document.getElementById('loginForm').classList.toggle('hidden');document.getElementById('signupForm').classList.toggle('hidden');}
(function(){let d=document.getElementById('regDay');for(let i=1;i<=31;i++){let o=document.createElement('option');o.value=i;o.text=i;d.appendChild(o);}let m=document.getElementById('regMonth');["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].forEach((mm,i)=>{let o=document.createElement('option');o.value=i+1;o.text=mm;m.appendChild(o);});let y=document.getElementById('regYear');for(let i=2008;i>=1975;i--){let o=document.createElement('option');o.value=i;o.text=i;y.appendChild(o);}})();
async function register(){let n=regName.value.trim(),e=regEmail.value.trim().toLowerCase(),p=regPass.value,cp=regConfirmPass.value;if(!n||!e||!p||!cp){authStatus.innerText='❌ Fill all';return;}if(p!==cp){authStatus.innerText='❌ Pass not matching';return;}if(p.length<6){authStatus.innerText='❌ Min 6 chars';return;}let s=await db.ref('users').orderByChild('email').equalTo(e).once('value');if(s.exists()){authStatus.innerText='❌ Email exists';return;}pendingSignupData={name:n,email:e,pass:p};await sendSignupOTP(e);}
async function sendSignupOTP(email){signupOtpModal.classList.add('open');signupOtpEmailText.innerText=email;signupOtpStatus.innerText='Sending OTP...';let otp=Math.floor(100000+Math.random()*900000).toString();let safe=email.replace(/\./g,'_').replace(/@/g,'_at_');await db.ref('signup_otps/'+safe).set({email,otp,expiry:Date.now()+300000});try{await emailjs.send(SERVICE_ID,TEMPLATE_ID,{to_email:email,to_name:pendingSignupData.name,otp:otp});signupOtpStatus.innerText='✅ OTP sent to Gmail';}catch{signupOtpStatus.innerHTML=`DEV OTP: <b style="color:#22c55e;font-size:22px">${otp}</b>`;}}
function closeSignupOtp(){signupOtpModal.classList.remove('open');}
async function resendSignupOTP(){if(pendingSignupData) await sendSignupOTP(pendingSignupData.email);}
async function verifySignupOTP(){let oi=signupOtpInput.value.trim();if(oi.length!=6){signupOtpStatus.innerText='❌ Enter OTP';return;}let safe=pendingSignupData.email.replace(/\./g,'_').replace(/@/g,'_at_');let snap=await db.ref('signup_otps/'+safe).once('value');if(!snap.exists()){signupOtpStatus.innerText='❌ Not found';return;}let d=snap.val();if(Date.now()>d.expiry){signupOtpStatus.innerText='❌ Expired';return;}if(d.otp!==oi){signupOtpStatus.innerText='❌ Wrong OTP';return;}let u=db.ref('users').push();let newUser={name:pendingSignupData.name,email:pendingSignupData.email,pass:btoa(pendingSignupData.pass),created:Date.now(),streak:0};await u.set(newUser);await db.ref('signup_otps/'+safe).remove();currentUser=newUser;localStorage.setItem('iitm_user',JSON.stringify(currentUser));localStorage.setItem('iitm_userKey',u.key);closeSignupOtp();showApp();}
async function login(){let e=loginEmail.value.trim().toLowerCase(),p=loginPass.value;if(!e||!p){authStatus.innerText='❌ Fill';return;}if(e==='admin@iitm.com'&&p==='admin123'){currentUser={name:'Gaurav',email:e};isAdmin=true;localStorage.setItem('iitm_user',JSON.stringify(currentUser));localStorage.setItem('iitm_admin','true');showApp();return;}authStatus.innerText='Logging...';let s=await db.ref('users').orderByChild('email').equalTo(e).once('value');if(!s.exists()){authStatus.innerText='❌ Not found';return;}let f=null;s.forEach(c=>{let d=c.val();d._key=c.key;if(atob(d.pass)===p)f=d;});if(!f){authStatus.innerText='❌ Wrong pass';return;}currentUser=f;localStorage.setItem('iitm_user',JSON.stringify(f));localStorage.setItem('iitm_userKey',f._key);showApp();}
function googleLogin(){let provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});auth.signInWithPopup(provider).then(async res=>{await handleGoogleUser(res.user);}).catch(async e=>{try{await auth.signInWithRedirect(provider);}catch(err){authStatus.innerText='❌ Google: '+e.message;}});}
async function handleGoogleUser(u){let email=u.email.toLowerCase(),name=u.displayName||email.split('@')[0],photo=u.photoURL||'';if(email.includes('admin')||email==='gaurav.gupta.aiml@gmail.com'){currentUser={name:'Gaurav Gupta',email:email};isAdmin=true;localStorage.setItem('iitm_user',JSON.stringify(currentUser));localStorage.setItem('iitm_admin','true');showApp();return;}let snap=await db.ref('users').orderByChild('email').equalTo(email).once('value');let key=null,existing=null;if(!snap.exists()){let nu=db.ref('users').push();await nu.set({name:name,email:email,pass:'google',photo:photo,created:Date.now()});key=nu.key;}else{snap.forEach(c=>{key=c.key;existing=c.val();});}currentUser={name:existing?.name||name,email:email,photo:photo};localStorage.setItem('iitm_user',JSON.stringify(currentUser));localStorage.setItem('iitm_userKey',key);showApp();}
async function checkIsAdmin(email){if(!email) return false;let e=email.toLowerCase();if(e==='admin@iitm.com'||e==='gaurav.gupta.aiml@gmail.com') return true;let safe=e.replace(/\./g,'_').replace(/@/g,'_at_');let s=await db.ref('admins/'+safe).once('value');return s.exists();}
async function showApp(){let u=JSON.parse(localStorage.getItem('iitm_user')||'null');if(u) currentUser=u;if(!currentUser) return;loginScreen.classList.add('hidden');mainApp.classList.remove('hidden');let adminCheck=await checkIsAdmin(currentUser.email);isAdmin=adminCheck||localStorage.getItem('iitm_admin')==='true';if(isAdmin){adminTabBtn.style.display='block';adminPYQBox.classList.remove('hidden');adminSolBox.classList.remove('hidden');adminNotesBox.classList.remove('hidden');}upd();filterPYQ();filterSols();renderNotes();}
function logout(){localStorage.clear();location.reload();}
window.onload=()=>{let u=localStorage.getItem('iitm_user');if(u){currentUser=JSON.parse(u);showApp();}};
function upd(){let h=String(Math.floor(sec/3600)).padStart(2,'0'),m=String(Math.floor(sec%3600/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');time.innerText=h+':'+m+':'+s;}
function toggleStartStop(){if(iv){clearInterval(iv);iv=null;isPaused=false;sec=0;upd();}else{startTimestamp=Date.now();iv=setInterval(()=>{sec=Math.floor((Date.now()-startTimestamp)/1000);upd();},1000);}}
function togglePauseResume(){if(!iv) return;isPaused=!isPaused;}
function rs(){clearInterval(iv);iv=null;sec=0;upd();}
function save(){alert('Saved');}
function showTab(v){['study','pyq','notes','sols','saved','support','admin','calc','boardM'].forEach(x=>{let el=document.getElementById(x+'Tab');if(el) el.style.display=x==v?'block':'none';});}
function openMenu(){}function closeMenu(){}
function openProfile(){profileModal.classList.add('open');}
function closeProfile(){profileModal.classList.remove('open');}
function saveProfile(){alert('Saved');closeProfile();}
function openOTP(){otpModal.classList.add('open');otpStep1.classList.remove('hidden');otpStep2.classList.add('hidden');}
function closeOTP(){otpModal.classList.remove('open');}
function backToEmail(){otpStep1.classList.remove('hidden');otpStep2.classList.add('hidden');}
async function sendOTP(){let email=resetEmail.value.trim().toLowerCase();let otp=Math.floor(100000+Math.random()*900000).toString();let safe=email.replace(/\./g,'_').replace(/@/g,'_at_');await db.ref('password_resets/'+safe).set({email,otp,expiry:Date.now()+300000});try{await emailjs.send(SERVICE_ID,TEMPLATE_ID,{to_email:email,otp:otp});otpStatus.innerText='✅ OTP sent';}catch{otpStatus.innerHTML=`OTP: <b>${otp}</b>`;}otpStep1.classList.add('hidden');otpStep2.classList.remove('hidden');}
async function verifyAndReset(){let email=resetEmail.value.trim().toLowerCase(),oi=otpInput.value.trim(),np=newPassInput.value.trim();let safe=email.replace(/\./g,'_').replace(/@/g,'_at_');let snap=await db.ref('password_resets/'+safe).once('value');let d=snap.val();if(d.otp!==oi){otpStatus.innerText='❌ Wrong';return;}let us=await db.ref('users').orderByChild('email').equalTo(email).once('value');us.forEach(c=>{db.ref('users/'+c.key).update({pass:btoa(np)});});await db.ref('password_resets/'+safe).remove();otpStatus.innerText='✅ Reset';setTimeout(()=>closeOTP(),1000);}
function toggleBookmark(id,type){let key=type+'_'+id;let idx=bookmarks.indexOf(key);if(idx>-1) bookmarks.splice(idx,1);else bookmarks.push(key);localStorage.setItem('bookmarks',JSON.stringify(bookmarks));renderSaved();}
function isBookmarked(id,type){return bookmarks.includes(type+'_'+id);}
function renderSaved(){let list=document.getElementById('savedList');let pyqSaved=allPYQ.filter(x=>bookmarks.includes('pyq_'+x.id));if(pyqSaved.length==0){list.innerHTML='No saved';return;}list.innerHTML='';pyqSaved.forEach(d=>{list.innerHTML+=`<div class="pyq-card"><b>${d.title}</b><a href="${d.link}" target="_blank">Open</a></div>`;});}
function filterPYQ(){pyqList.innerHTML='';allPYQ.slice().reverse().forEach(d=>{pyqList.innerHTML+=`<div class="pyq-card"><b>${d.title}</b><a href="${d.link}" target="_blank">Open</a><button onclick="toggleBookmark('${d.id}','pyq')">⭐</button>${isAdmin?`<button onclick="if(confirm('Delete?')) db.ref('pyqs/${d.id}').remove()">🗑️</button>`:''}</div>`;});pyqCount.innerText=allPYQ.length;}
db.ref('pyqs').on('value',s=>{allPYQ=[];s.forEach(c=>{let v=c.val();v.id=c.key;allPYQ.push(v);});filterPYQ();});
function addPYQ(){let t=pyqTitle.value.trim(),l=pyqLink.value.trim();if(!t||!l) return;db.ref('pyqs').push({title:t,link:l,t:Date.now()});pyqTitle.value='';pyqLink.value='';}
function renderNotes(){notesList.innerHTML='';allNotes.slice().reverse().forEach(d=>{notesList.innerHTML+=`<div class="pyq-card"><b>${d.title}</b><a href="${d.link}" target="_blank">Open</a></div>`;});totalNotesCount.innerText=allNotes.length;}
db.ref('notes').on('value',s=>{allNotes=[];s.forEach(c=>{let v=c.val();v.id=c.key;allNotes.push(v);});renderNotes();});
function addNotes(){let t=notesTitle.value.trim(),l=notesLink.value.trim();if(!t||!l) return;db.ref('notes').push({title:t,link:l,t:Date.now()});notesTitle.value='';notesLink.value='';}
function filterSols(){solutionsList.innerHTML='';allSols.slice().reverse().forEach(d=>{solutionsList.innerHTML+=`<div class="pyq-card"><b>${d.title}</b><a href="${d.link}" target="_blank">Open</a></div>`;});solCount.innerText=allSols.length;}
db.ref('solutions').on('value',s=>{allSols=[];s.forEach(c=>{let v=c.val();v.id=c.key;allSols.push(v);});filterSols();});
function addSolution(){let t=solTitle.value.trim(),l=solLink.value.trim();if(!t||!l) return;db.ref('solutions').push({title:t,link:l,t:Date.now()});solTitle.value='';solLink.value='';}
function submitTicket(){let sub=ticketSubject.value.trim(),msg=ticketMessage.value.trim();if(!sub||!msg) return;db.ref('tickets').push({email:currentUser.email,subject:sub,message:msg,t:Date.now()});alert('Submitted');}
db.ref('tickets').on('value',s=>{allTickets=[];s.forEach(c=>{let v=c.val();v.id=c.key;allTickets.push(v);});myTicketsList.innerHTML='';allTickets.filter(t=>t.email==currentUser?.email).forEach(t=>{myTicketsList.innerHTML+=`<div style="background:#0f172a;padding:10px;border-radius:10px;margin-bottom:6px"><b>${t.subject}</b><p>${t.message}</p></div>`;});});
function makeAdminByEmail(){let e=newAdminEmail.value.trim().toLowerCase();let safe=e.replace(/\./g,'_').replace(/@/g,'_at_');db.ref('admins/'+safe).set({email:e});}
function removeAdminByEmail(){let e=newAdminEmail.value.trim().toLowerCase();let safe=e.replace(/\./g,'_').replace(/@/g,'_at_');db.ref('admins/'+safe).remove();}
