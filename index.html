<!DOCTYPE html><html><head><meta name="monetag" content="d80205f6c96acdc2bd17e0296ece8c34"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>IITM SOLUTIONS</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}body{background:#060a18;color:#e2e8f0;overflow-x:hidden}:root{--p:#38bdf8;--p2:#8b5cf6;--card:#0f172a;--card2:#151f3a;--border:#1e293b}
.login-screen{position:fixed;inset:0;background:radial-gradient(ellipse at top, #1e293b 0%, #060a18 60%);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}.login-box{background:linear-gradient(180deg, #111d36 0%, #0f172a 100%);border:1px solid #1e293b;border-radius:28px;padding:36px;max-width:440px;width:100%;margin:auto}
.header{background:rgba(15,23,42,.8);backdrop-filter:blur(20px);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:100}
.logo{display:flex;flex-direction:column;line-height:1}.logo-main{display:flex;align-items:baseline;gap:6px}.logo-iitm{font-weight:900;font-size:28px;letter-spacing:-1px;background:linear-gradient(90deg,#38bdf8 0%, #8b5cf6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.logo-sol{font-weight:600;font-size:21px;letter-spacing:-0.5px;background:linear-gradient(90deg,#38bdf8 0%, #e2e8f0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.logo small{font-size:9px;letter-spacing:3px;color:#94a3b8;margin-top:2px;font-weight:600;opacity:.9}
.admin-badge{background:linear-gradient(90deg,#facc15,#f97316);color:#000;padding:6px 12px;border-radius:20px;font-size:10px;font-weight:800}.hidden{display:none!important}.creator-badge{background:linear-gradient(135deg,var(--p),var(--p2));color:white;padding:6px 14px;border-radius:100px;font-size:10px;font-weight:800}
.btn{padding:12px 22px;border:none;border-radius:14px;font-weight:800;cursor:pointer}input,select,textarea{width:100%;padding:13px 16px;background:#080d1d;border:1px solid var(--border);border-radius:14px;color:white;margin:7px 0;outline:none;font-size:13px}.dob-row{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px}
#profileModal,#otpModal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px}#profileModal.open,#otpModal.open{display:flex}
#signupOtpModal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;display:none;align-items:center;justify-content:center;padding:16px}
</style>
</head><body>

<div id="loginScreen" class="login-screen"><div class="login-box"><div style="text-align:center;margin-bottom:20px"><div class="creator-badge">👑 GAURAV GUPTA</div></div><div style="text-align:center"><div style="display:flex;align-items:baseline;gap:6px;justify-content:center"><span style="font-weight:900;font-size:28px;background:linear-gradient(90deg,#38bdf8,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent">IITM</span><span style="font-weight:600;font-size:21px;background:linear-gradient(90deg,#38bdf8,#e2e8f0);-webkit-background-clip:text;-webkit-text-fill-color:transparent">SOLUTIONS</span></div><small style="font-size:9px;letter-spacing:3px;color:#94a3b8">BY GAURAV GUPTA</small></div>

<div id="loginForm" style="margin-top:20px"><button onclick="googleLogin()" style="width:100%;background:white;color:black;padding:13px;border-radius:14px;border:none;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px"><img src="https://www.svgrepo.com/show/475656/google-color.svg" style="width:20px"> Continue with Google</button><div style="text-align:center;margin:14px 0;opacity:.3;font-size:11px;display:flex;align-items:center;gap:10px"><div style="flex:1;height:1px;background:rgba(255,255,255,.2)"></div>OR<div style="flex:1;height:1px;background:rgba(255,255,255,.2)"></div></div><input id="loginEmail" placeholder="📧 Email"><input id="loginPass" type="password" placeholder="🔒 Password"><button onclick="login()" style="width:100%;background:linear-gradient(90deg,#38bdf8,#8b5cf6);color:white;padding:15px;border-radius:14px;border:none;font-weight:800;margin-top:12px">Login →</button><p style="margin-top:16px;text-align:center"><span onclick="openOTP()" style="color:#ef4444;cursor:pointer;font-weight:800;background:rgba(239,68,68,.12);padding:8px 16px;border-radius:20px;border:1px solid rgba(239,68,68,.2);font-size:12px;display:inline-block">🔑 Forgot Password? OTP Reset</span></p><p style="margin-top:12px;font-size:12px;text-align:center;opacity:.7">New? <span onclick="toggleAuth()" style="color:#38bdf8;cursor:pointer;font-weight:700">Create Account</span></p></div>

<div id="signupForm" class="hidden" style="margin-top:20px"><input id="regName" placeholder="👤 Full Name"><input id="regEmail" placeholder="📧 Email"><input id="regPass" type="password" placeholder="🔒 Password (min 6)"><select id="regGender"><option value="">👤 Select Gender</option><option>Male</option><option>Female</option><option>Other</option></select><label style="font-size:10px;opacity:.6;margin-top:6px;display:block">📅 DOB</label><div class="dob-row"><select id="regDay"><option value="">Day</option></select><select id="regMonth"><option value=""><option value="">Month</option><option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option><option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option><option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option><option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option></select><select id="regYear"><option value="">Year</option></select></div><select id="regAge"><option value="">🎂 Select Age</option></select><button onclick="register()" style="width:100%;background:linear-gradient(90deg,#22c55e,#16a34a);color:white;padding:15px;border-radius:14px;border:none;font-weight:800;margin-top:12px">Create Account - Send OTP ✨</button><p style="margin-top:16px;font-size:12px;text-align:center;opacity:.7">Have account? <span onclick="toggleAuth()" style="color:#38bdf8;cursor:pointer;font-weight:700">Login</span></p></div><p id="authStatus" style="font-size:11px;margin-top:14px;text-align:center"></p></div></div>

<!-- SIGNUP OTP MODAL - DIRECT LOGIN VERSION -->
<div id="signupOtpModal"><div style="background:#0f172a;border:1px solid rgba(255,255,255,.2);border-radius:22px;padding:24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6)"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="color:white">📧 Verify Email</h3><button onclick="closeSignupOtp()" style="background:#1e293b;color:white;border:none;padding:6px 12px;border-radius:20px;font-weight:800">✕</button></div><p style="font-size:11px;color:#94a3b8;margin-top:10px">OTP sent to <b id="signupOtpEmailText" style="color:#38bdf8"></b></p><input id="signupOtpInput" placeholder="• • • • • •" maxlength="6" style="text-align:center;letter-spacing:14px;font-size:28px;font-weight:900;margin-top:16px;border:2px solid #38bdf8"><button onclick="verifySignupOTP()" style="width:100%;background:linear-gradient(90deg,#22c55e,#16a34a);color:white;padding:14px;border-radius:12px;border:none;font-weight:800;margin-top:16px">Verify & Login Directly 🚀</button><button onclick="resendSignupOTP()" style="width:100%;background:#1e293b;color:#38bdf8;padding:10px;border-radius:10px;border:none;margin-top:8px;font-size:12px">Resend OTP 🔄</button><p id="signupOtpStatus" style="font-size:12px;text-align:center;margin-top:12px;color:#facc15;min-height:20px;font-weight:700"></p></div></div>

<div id="mainApp" class="hidden"><div class="header"><div class="logo"><div class="logo-main"><span class="logo-iitm">IITM</span><span class="logo-sol">SOLUTIONS</span></div><small>BY GAURAV GUPTA</small></div><button onclick="logout()" style="background:#1e293b;color:white;padding:8px 14px;border-radius:100px;border:none;font-size:11px">Logout</button></div>
<div style="padding:40px;text-align:center"><h1>Welcome to IITM SOLUTIONS 🎉</h1><p id="welcomeName" style="margin-top:10px;color:#38bdf8;font-weight:800"></p><p style="opacity:.6;margin-top:6px">Login Successful - Direct OTP Login</p></div>
</div>

<div id="otpModal"><div style="background:#0f172a;border-radius:22px;padding:24px;max-width:380px;width:100%"><div style="display:flex;justify-content:space-between"><h3>🔑 OTP Reset</h3><button onclick="closeOTP()" style="background:#1e293b;color:white;border:none;padding:6px 10px;border-radius:20px">✕</button></div><div id="otpStep1" style="margin-top:16px"><input id="resetEmail" placeholder="📧 Email"><button onclick="sendOTP()" id="sendBtn" style="width:100%;background:linear-gradient(90deg,#38bdf8,#8b5cf6);color:white;padding:13px;border-radius:12px;border:none;font-weight:800;margin-top:10px">Send OTP 📩</button></div><div id="otpStep2" class="hidden" style="margin-top:16px"><input id="otpInput" placeholder="6-digit OTP" maxlength="6" style="text-align:center;letter-spacing:8px;font-size:22px;font-weight:800"><input id="newPassInput" type="password" placeholder="New Password"><button onclick="verifyAndReset()" style="width:100%;background:linear-gradient(90deg,#22c55e,#16a34a);color:white;padding:13px;border-radius:12px;border:none;font-weight:800;margin-top:10px">Verify & Reset ✅</button><button onclick="backToEmail()" style="width:100%;background:#1e293b;color:white;padding:10px;border-radius:10px;border:none;margin-top:8px;font-size:11px">← Back</button></div><p id="otpStatus" style="font-size:11px;text-align:center;margin-top:12px"></p></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyDSt8H43XQZFUF7MRuIqDq8Cdk4ZClwEDc",authDomain:"iitm-solutions.firebaseapp.com",databaseURL:"https://iitm-solutions-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"iitm-solutions",storageBucket:"iitm-solutions.firebasestorage.app",messagingSenderId:"411649171402",appId:"1:411649171402:web:e5278ba01a518080b0b933"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const auth=firebase.auth();
emailjs.init({publicKey:"0g35NzGfXah-1DMhS"});
const SERVICE_ID="service_q3nz8on", TEMPLATE_RESET="template_otvm3vh", TEMPLATE_SIGNUP="template_k0jcsmi";
let currentUser=null, pendingSignupData=null;

function toggleAuth(){document.getElementById('loginForm').classList.toggle('hidden');document.getElementById('signupForm').classList.toggle('hidden');}
(function(){
let dayEl=document.getElementById('regDay');dayEl.innerHTML='<option value="">Day</option>';for(let i=1;i<=31;i++){let o=document.createElement('option');o.value=i;o.text=i;dayEl.appendChild(o);}
let yearEl=document.getElementById('regYear');yearEl.innerHTML='<option value="">Year</option>';for(let i=2008;i>=1975;i--){let o=document.createElement('option');o.value=i;o.text=i;yearEl.appendChild(o);}
let ageEl=document.getElementById('regAge');ageEl.innerHTML='<option value="">Age</option>';for(let i=15;i<=60;i++){let o=document.createElement('option');o.value=i;o.text=i+' years';ageEl.appendChild(o);}
})();

async function register(){
  let n=document.getElementById('regName').value.trim();
  let e=document.getElementById('regEmail').value.trim().toLowerCase();
  let p=document.getElementById('regPass').value;
  let g=document.getElementById('regGender').value;
  let d=document.getElementById('regDay').value,m=document.getElementById('regMonth').value,y=document.getElementById('regYear').value,a=document.getElementById('regAge').value;
  if(!n||!e||p.length<6||!g||!d||!m||!y||!a){document.getElementById('authStatus').innerText='❌ All fields required';return;}
  let s=await db.ref('users').orderByChild('email').equalTo(e).once('value');
  if(s.exists()){document.getElementById('authStatus').innerText='❌ Email exists';return;}
  pendingSignupData={name:n,email:e,pass:p,gender:g,day:d,month:m,year:y,age:a,dob:d+'/'+m+'/'+y};
  await sendSignupOTP(e);
}

async function sendSignupOTP(email){
  if(!email) email=pendingSignupData.email;
  let modal=document.getElementById('signupOtpModal');
  modal.style.display='flex';
  document.getElementById('signupOtpEmailText').innerText=email;
  document.getElementById('signupOtpStatus').innerText='⏳ Sending OTP...';
  let otp=Math.floor(100000+Math.random()*900000).toString();
  let safe=email.replace(/\./g,'_').replace(/@/g,'_at_');
  try{await db.ref('signup_otps/'+safe).set({email:email,otp:otp,expiry:Date.now()+300000});}catch(e){}
  try{
    await emailjs.send(SERVICE_ID,TEMPLATE_SIGNUP,{to_email:email,email:email,to_name:pendingSignupData.name,otp:otp});
    document.getElementById('signupOtpStatus').innerText='✅ OTP sent! Check inbox/spam';
    document.getElementById('signupOtpStatus').style.color='#22c55e';
  }catch(err){
    document.getElementById('signupOtpStatus').innerHTML=`OTP: <b style="color:#22c55e;font-size:26px;letter-spacing:4px">${otp}</b><br><small>Ye daal de</small>`;
  }
}
function closeSignupOtp(){document.getElementById('signupOtpModal').style.display='none';}
async function resendSignupOTP(){ if(pendingSignupData) await sendSignupOTP(pendingSignupData.email); }

async function verifySignupOTP(){
  if(!pendingSignupData){document.getElementById('signupOtpStatus').innerText='❌ Session expired';return;}
  let oi=document.getElementById('signupOtpInput').value.trim();
  if(oi.length!=6){document.getElementById('signupOtpStatus').innerText='❌ 6 digit OTP daal';return;}
  let safe=pendingSignupData.email.replace(/\./g,'_').replace(/@/g,'_at_');
  let snap=await db.ref('signup_otps/'+safe).once('value');
  if(!snap.exists()){document.getElementById('signupOtpStatus').innerText='❌ OTP not found';return;}
  let d=snap.val();
  if(Date.now()>d.expiry){document.getElementById('signupOtpStatus').innerText='❌ Expired, resend kar';return;}
  if(d.otp!==oi){document.getElementById('signupOtpStatus').innerText='❌ Wrong OTP';return;}

  document.getElementById('signupOtpStatus').innerText='✅ Verified! Logging you in...';
  document.getElementById('signupOtpStatus').style.color='#22c55e';

  let u=db.ref('users').push();
  let newUser = {
    name:pendingSignupData.name,
    email:pendingSignupData.email,
    pass:btoa(pendingSignupData.pass),
    gender:pendingSignupData.gender,
    day:pendingSignupData.day,
    month:pendingSignupData.month,
    year:pendingSignupData.year,
    age:pendingSignupData.age,
    dob:pendingSignupData.dob,
    created:Date.now(),
    streak:0,
    profileComplete:true
  };
  await u.set(newUser);
  await db.ref('signup_otps/'+safe).remove();

  // DIRECT LOGIN - seedha app me
  newUser._key = u.key;
  currentUser = newUser;
  localStorage.setItem('iitm_user', JSON.stringify(currentUser));
  localStorage.setItem('iitm_userKey', u.key);
  localStorage.setItem('iitm_profile_done','true');

  closeSignupOtp();
  document.getElementById('signupOtpInput').value='';
  pendingSignupData=null;
  showApp();
}

async function login(){
  let e=document.getElementById('loginEmail').value.trim().toLowerCase(),p=document.getElementById('loginPass').value;
  if(!e||!p){document.getElementById('authStatus').innerText='❌ Email & Pass required';return;}
  document.getElementById('authStatus').innerText='⏳ Logging...';
  try{
    let s=await db.ref('users').orderByChild('email').equalTo(e).once('value');
    if(!s.exists()){document.getElementById('authStatus').innerText='❌ Email not found';return;}
    let f=null;s.forEach(c=>{let d=c.val();d._key=c.key;try{if(atob(d.pass)===p) f=d;}catch{}});
    if(!f){document.getElementById('authStatus').innerText='❌ Wrong password';return;}
    currentUser=f;localStorage.setItem('iitm_user',JSON.stringify(currentUser));localStorage.setItem('iitm_userKey',f._key);showApp();
  }catch{ document.getElementById('authStatus').innerText='❌ Login error';}
}
function googleLogin(){let provider=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(provider).then(r=>{currentUser={name:r.user.displayName,email:r.user.email};localStorage.setItem('iitm_user',JSON.stringify(currentUser));showApp();});}
function showApp(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');let nameEl=document.getElementById('welcomeName');if(nameEl && currentUser) nameEl.innerText='Hi, '+currentUser.name+' 👋';}
function logout(){localStorage.clear();location.reload();}
window.onload=()=>{let u=localStorage.getItem('iitm_user');if(u){currentUser=JSON.parse(u);showApp();}};
function openOTP(){document.getElementById('otpModal').style.display='flex';}
function closeOTP(){document.getElementById('otpModal').style.display='none';}
function backToEmail(){document.getElementById('otpStep1').classList.remove('hidden');document.getElementById('otpStep2').classList.add('hidden');}
async function sendOTP(){let email=document.getElementById('resetEmail').value.trim().toLowerCase();if(!email)return;let otp=Math.floor(100000+Math.random()*900000).toString();let safe=email.replace(/\./g,'_').replace(/@/g,'_at_');await db.ref('password_resets/'+safe).set({email:email,otp:otp,expiry:Date.now()+300000});document.getElementById('otpStep1').classList.add('hidden');document.getElementById('otpStep2').classList.remove('hidden');try{await emailjs.send(SERVICE_ID,TEMPLATE_RESET,{to_email:email,otp:otp});document.getElementById('otpStatus').innerText='✅ OTP sent';}catch{document.getElementById('otpStatus').innerHTML=`OTP: <b>${otp}</b>`;}}
async function verifyAndReset(){let email=document.getElementById('resetEmail').value.trim().toLowerCase(),oi=document.getElementById('otpInput').value.trim(),np=document.getElementById('newPassInput').value.trim();let safe=email.replace(/\./g,'_').replace(/@/g,'_at_');let snap=await db.ref('password_resets/'+safe).once('value');if(!snap.exists())return;let d=snap.val();if(d.otp!==oi||Date.now()>d.expiry){document.getElementById('otpStatus').innerText='❌ Wrong/Expired';return;}let us=await db.ref('users').orderByChild('email').equalTo(email).once('value');let pr=[];us.forEach(c=>{pr.push(db.ref('users/'+c.key).update({pass:btoa(np)}));});await Promise.all(pr);await db.ref('password_resets/'+safe).remove();document.getElementById('otpStatus').innerText='✅ Reset Done';setTimeout(()=>closeOTP(),1000);}
</script>
</body></html>
