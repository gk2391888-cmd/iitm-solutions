<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IITM SOLUTIONS</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#060a18;color:#fff}
.login-screen{position:fixed;inset:0;background:#060a18;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}
.login-box{background:#0f172a;border:1px solid #1e293b;border-radius:24px;padding:28px;max-width:420px;width:100%}
input{width:100%;padding:13px;margin:6px 0;background:#080d1d;border:1px solid #334155;border-radius:12px;color:white}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:800;cursor:pointer}
.hidden{display:none!important}
#signupOtpModal,#otpModal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:none;align-items:center;justify-content:center;padding:15px}
#signupOtpModal.open,#otpModal.open{display:flex!important}
.google-btn{background:#fff;color:#000;display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px}
.divider{display:flex;align-items:center;gap:10px;margin:12px 0;opacity:.5;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#334155}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen"><div class="login-box">
<div style="text-align:center"><h2 style="color:#38bdf8">IITM SOLUTIONS</h2><small>BY GAURAV GUPTA</small></div>

<div id="loginForm" style="margin-top:20px">
<input id="loginEmail" placeholder="Email">
<input id="loginPass" type="password" placeholder="Password">
<button onclick="login()" class="btn" style="background:linear-gradient(90deg,#38bdf8,#8b5cf6);color:white;margin-top:10px">Login →</button>
<div class="divider">OR</div>
<button onclick="googleLogin()" class="btn google-btn"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Continue with Google</button>
<p style="margin-top:14px;text-align:center;font-size:12px"><span onclick="openOTP()" style="color:#ef4444;cursor:pointer">Forgot Password? OTP Reset</span></p>
<p style="margin-top:10px;text-align:center;font-size:12px">New? <span onclick="toggleAuth()" style="color:#38bdf8;cursor:pointer">Create Account</span></p>
</div>

<div id="signupForm" class="hidden" style="margin-top:20px">
<input id="regName" placeholder="Full Name">
<input id="regEmail" placeholder="Email">
<input id="regPass" type="password" placeholder="Password min 6">
<button onclick="register()" class="btn" style="background:#22c55e;color:white;margin-top:10px">Create Account - Send OTP ✨</button>
<div class="divider">OR</div>
<button onclick="googleLogin()" class="btn google-btn"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Continue with Google</button>
<p style="margin-top:10px;text-align:center;font-size:12px">Have account? <span onclick="toggleAuth()" style="color:#38bdf8;cursor:pointer">Login</span></p>
</div>
<p id="authStatus" style="font-size:11px;margin-top:12px;text-align:center"></p>
</div></div>

<div id="mainApp" class="hidden" style="padding:30px;text-align:center"><h1>Welcome to IITM SOLUTIONS</h1><button onclick="logout()" style="margin-top:20px;padding:10px 20px;border-radius:20px;border:none">Logout</button></div>

<!-- SIGNUP OTP THEN REGISTER MODAL -->
<div id="signupOtpModal"><div style="background:#0f172a;border:1px solid #334155;border-radius:20px;padding:22px;max-width:360px;width:100%">
<h3>Verify Email - IITM SOLUTIONS</h3>
<p style="font-size:11px;margin-top:8px">OTP sent to <b id="signupOtpEmailText" style="color:#38bdf8"></b></p>
<input id="signupOtpInput" placeholder="6-digit OTP" maxlength="6" style="text-align:center;letter-spacing:8px;font-size:22px;font-weight:800;margin-top:14px">
<button onclick="verifySignupOTP()" class="btn" style="background:#22c55e;color:white;margin-top:12px">Verify OTP & Register ✅</button>
<button onclick="resendSignupOTP()" class="btn" style="background:#1e293b;color:#38bdf8;margin-top:8px">Resend OTP 🔄</button>
<p id="signupOtpStatus" style="font-size:11px;text-align:center;margin-top:10px"></p>
</div></div>

<div id="otpModal"><div style="background:#0f172a;border:1px solid #334155;border-radius:20px;padding:22px;max-width:360px;width:100%">
<h3>Forgot Password</h3>
<div id="otpStep1" style="margin-top:14px"><input id="resetEmail" placeholder="Enter your email"><button onclick="sendOTP()" class="btn" style="background:#38bdf8;color:white;margin-top:10px">Send OTP 📩</button></div>
<div id="otpStep2" class="hidden" style="margin-top:14px"><input id="otpInput" placeholder="6-digit OTP" maxlength="6"><input id="newPassInput" type="password" placeholder="New Password"><button onclick="verifyAndReset()" class="btn" style="background:#22c55e;color:white;margin-top:10px">Reset Password ✅</button></div>
<p id="otpStatus" style="font-size:11px;text-align:center;margin-top:10px"></p>
<button onclick="closeOTP()" style="margin-top:10px;background:#1e293b;color:white;padding:8px 16px;border-radius:20px;border:none;width:100%">Close</button>
</div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyDSt8H43XQZFUF7MRuIqDq8Cdk4ZClwEDc",authDomain:"iitm-solutions.firebaseapp.com",databaseURL:"https://iitm-solutions-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"iitm-solutions",storageBucket:"iitm-solutions.firebasestorage.app",messagingSenderId:"411649171402",appId:"1:411649171402:web:e5278ba01a518080b0b933"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const auth=firebase.auth();
emailjs.init({publicKey:"0g35NzGfXah-1DMhS"});

// --- FINAL IDS ---
const SERVICE_ID="service_q3nz8on";
const TEMPLATE_SIGNUP="template_k0jcsmi"; // Signup OTP
const TEMPLATE_RESET="template_otvm3vh"; // Reset OTP
let pendingSignupData=null;

function toggleAuth(){document.getElementById('loginForm').classList.toggle('hidden');document.getElementById('signupForm').classList.toggle('hidden');}

async function googleLogin(){
 let provider=new firebase.auth.GoogleAuthProvider();
 try{
  let res=await auth.signInWithPopup(provider);
  let u=res.user;
  let snap=await db.ref('users').orderByChild('email').equalTo(u.email.toLowerCase()).once('value');
  if(!snap.exists()){let r=db.ref('users').push();await r.set({name:u.displayName,email:u.email.toLowerCase(),created:Date.now(),emailVerified:true});}
  localStorage.setItem('iitm_user',JSON.stringify({name:u.displayName,email:u.email}));
  location.reload();
 }catch(e){document.getElementById('authStatus').innerText=e.message;}
}

// 1. SIGNUP -> OTP
async function register(){
 let n=document.getElementById('regName').value.trim(),e=document.getElementById('regEmail').value.trim().toLowerCase(),p=document.getElementById('regPass').value;
 if(!n||!e||p.length<6){document.getElementById('authStatus').innerText='❌ All fields + min 6 pass';return;}
 let s=await db.ref('users').orderByChild('email').equalTo(e).once('value');
 if(s.exists()){document.getElementById('authStatus').innerText='❌ Email already exists';return;}
 pendingSignupData={name:n,email:e,pass:p};
 await sendSignupOTP(e);
}

async function sendSignupOTP(email){
 if(!email) email=pendingSignupData.email;
 let safe=email.replace(/\./g,'_').replace(/@/g,'_at_');
 let otp=Math.floor(100000+Math.random()*900000).toString();
 let modal=document.getElementById('signupOtpModal');modal.classList.add('open');modal.style.display='flex';
 document.getElementById('signupOtpEmailText').innerText=email;
 document.getElementById('signupOtpStatus').innerText='⏳ Sending OTP to '+email;
 document.getElementById('authStatus').innerText='⏳ OTP sending to '+email;
 try{await db.ref('signup_otps/'+safe).set({email:email,otp:otp,expiry:Date.now()+300000});}catch(e){}
 try{
  await emailjs.send(SERVICE_ID,TEMPLATE_SIGNUP,{to_email:email,email:email,to_name:pendingSignupData.name,otp:otp,from_name:'IITM SOLUTIONS',message:`Your IITM SOLUTIONS OTP is ${otp}. Valid 5 min.`});
  document.getElementById('signupOtpStatus').innerText='✅ OTP sent! Check inbox & spam';
  document.getElementById('signupOtpStatus').style.color='#22c55e';
 }catch(err){
  document.getElementById('signupOtpStatus').innerHTML=`Email fail but OTP: <b style="color:#22c55e;font-size:24px">${otp}</b><br><small>ye daal ke register karo</small>`;
 }
}

async function resendSignupOTP(){if(pendingSignupData) await sendSignupOTP(pendingSignupData.email);}

// 2. VERIFY OTP -> THEN REGISTER
async function verifySignupOTP(){
 let email=pendingSignupData.email,oi=document.getElementById('signupOtpInput').value.trim(),st=document.getElementById('signupOtpStatus');
 if(oi.length!=6){st.innerText='❌ 6 digit OTP';return;}
 let safe=email.replace(/\./g,'_').replace(/@/g,'_at_');
 let snap=await db.ref('signup_otps/'+safe).once('value');
 if(!snap.exists()){st.innerText='❌ OTP not found';return;}
 let d=snap.val();if(Date.now()>d.expiry){st.innerText='❌ Expired, resend karo';return;}if(d.otp!==oi){st.innerText='❌ Wrong OTP';return;}
 st.innerText='✅ Verified! Registering...';
 let u=db.ref('users').push();
 await u.set({name:pendingSignupData.name,email:pendingSignupData.email,pass:btoa(pendingSignupData.pass),created:Date.now(),emailVerified:true});
 await db.ref('signup_otps/'+safe).remove();
 document.getElementById('authStatus').innerText='✅ Account Created! Login karo';
 document.getElementById('signupOtpModal').classList.remove('open');document.getElementById('signupOtpModal').style.display='none';
 toggleAuth();pendingSignupData=null;
}

async function login(){let e=document.getElementById('loginEmail').value.trim().toLowerCase(),p=document.getElementById('loginPass').value;let s=await db.ref('users').orderByChild('email').equalTo(e).once('value');if(!s.exists()){document.getElementById('authStatus').innerText='❌ Not found';return;}let f=null;s.forEach(c=>{let d=c.val();if(atob(d.pass)===p)f=d;});if(!f){document.getElementById('authStatus').innerText='❌ Wrong pass';return;}localStorage.setItem('iitm_user',JSON.stringify(f));location.reload();}
function logout(){localStorage.clear();location.reload();}
function openOTP(){let m=document.getElementById('otpModal');m.classList.add('open');m.style.display='flex';}
function closeOTP(){let m=document.getElementById('otpModal');m.classList.remove('open');m.style.display='none';document.getElementById('otpStep1').classList.remove('hidden');document.getElementById('otpStep2').classList.add('hidden');}
async function sendOTP(){let email=document.getElementById('resetEmail').value.trim().toLowerCase();let otp=Math.floor(100000+Math.random()*900000).toString();let safe=email.replace(/\./g,'_').replace(/@/g,'_at_');try{await db.ref('password_resets/'+safe).set({email:email,otp:otp,expiry:Date.now()+300000});}catch(e){}document.getElementById('otpStep1').classList.add('hidden');document.getElementById('otpStep2').classList.remove('hidden');try{await emailjs.send(SERVICE_ID,TEMPLATE_RESET,{to_email:email,email:email,to_name:email,otp:otp,from_name:'IITM SOLUTIONS',message:`Reset OTP ${otp}`});document.getElementById('otpStatus').innerText='✅ OTP sent';}catch{ document.getElementById('otpStatus').innerHTML=`OTP: <b style="color:#22c55e">${otp}</b>`;}}
async function verifyAndReset(){let email=document.getElementById('resetEmail').value.trim().toLowerCase(),oi=document.getElementById('otpInput').value.trim(),np=document.getElementById('newPassInput').value.trim();let safe=email.replace(/\./g,'_').replace(/@/g,'_at_');let snap=await db.ref('password_resets/'+safe).once('value');if(!snap.exists())return;let d=snap.val();if(d.otp!==oi||Date.now()>d.expiry){document.getElementById('otpStatus').innerText='❌ Wrong/Expired';return;}let us=await db.ref('users').orderByChild('email').equalTo(email).once('value');let pr=[];us.forEach(c=>{pr.push(db.ref('users/'+c.key).update({pass:btoa(np)}));});await Promise.all(pr);await db.ref('password_resets/'+safe).remove();document.getElementById('otpStatus').innerText='✅ Done! Login';setTimeout(()=>closeOTP(),1200);}

window.onload=()=>{let u=localStorage.getItem('iitm_user');if(u){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');}}
</script>
</body>
</html>
