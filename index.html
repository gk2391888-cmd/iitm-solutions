<script>
const firebaseConfig={apiKey:"AIzaSyBtugz-3SDbpoH5zOOvQI0AoAb6kbqb0dc",authDomain:"iitm-solutions.firebaseapp.com",databaseURL:"https://iitm-solutions-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"iitm-solutions",storageBucket:"iitm-solutions.firebasestorage.app",messagingSenderId:"411649171402",appId:"1:411649171402:web:e5278ba01a518080b0b933"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const auth=firebase.auth();
try{emailjs.init("REPLACE_WITH_YOUR_PUBLIC_KEY");}catch(e){}
let currentUser=null,isAdmin=false,sec=0,iv=null;
function upd(){let h=String(Math.floor(sec/3600)).padStart(2,'0'),m=String(Math.floor(sec%3600/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');let el=document.getElementById('time');if(el)el.innerText=h+':'+m+':'+s;}function st(){if(iv)return;iv=setInterval(()=>{sec++;upd();},1000);}function sp(){clearInterval(iv);iv=null;}function rs(){sp();sec=0;upd();}function save(){if(sec<10){alert('10 sec min');return;}sp();db.ref('leaderboard').push({name:currentUser.name,time:sec,t:Date.now()});rs();alert('Saved!');}
function showTab(v){['study','ai','pyq','chat','sols'].forEach(x=>{let el=document.getElementById(x+'Tab');if(el)el.style.display=x==v?'block':'none';});document.querySelectorAll('.b-item').forEach(b=>{if(b.dataset.tab) b.classList.toggle('active',b.dataset.tab===v);});document.querySelectorAll('.tab').forEach(t=>{if(t.textContent.toLowerCase().includes(v)|| (v=='study'&&t.textContent.includes('Timer'))) t.classList.add('active'); else t.classList.remove('active');}); let activeTab=document.querySelector(`.tab[onclick="showTab('${v}')"]`); if(activeTab) activeTab.classList.add('active');}
function openMenu(){document.getElementById('menuDrawer').style.display='block'}function closeMenu(){document.getElementById('menuDrawer').style.display='none'}

(function(){let d=document.getElementById('regDay');let pd=document.getElementById('pDay');for(let i=1;i<=31;i++){let o=document.createElement('option');o.value=i;o.text=i;if(d) d.appendChild(o.cloneNode(true)); if(pd) pd.appendChild(o);}let y=document.getElementById('regYear');let py=document.getElementById('pYear');for(let i=2008;i>=1980;i--){let o=document.createElement('option');o.value=i;o.text=i;if(y) y.appendChild(o.cloneNode(true)); if(py) py.appendChild(o);}let a=document.getElementById('regAge');let pa=document.getElementById('pAge');for(let i=15;i<=60;i++){let o=document.createElement('option');o.value=i;o.text=i+' years';if(a) a.appendChild(o.cloneNode(true)); if(pa) pa.appendChild(o);} })();

function toggleAuth(){document.getElementById('loginForm').classList.toggle('hidden');document.getElementById('signupForm').classList.toggle('hidden');}
async function register(){let n=document.getElementById('regName').value.trim(),e=document.getElementById('regEmail').value.trim().toLowerCase(),p=document.getElementById('regPass').value;let gender=document.getElementById('regGender').value,day=document.getElementById('regDay').value,month=document.getElementById('regMonth').value,year=document.getElementById('regYear').value,age=document.getElementById('regAge').value;if(!n||!e||p.length<6||!gender||!day||!month||!year||!age){document.getElementById('authStatus').innerText='❌ All fields: Name,Email,Pass,Gender,DOB,Age';return;}let dob=day+'/'+month+'/'+year;let s=await db.ref('users').orderByChild('email').equalTo(e).once('value');if(s.exists()){document.getElementById('authStatus').innerText='❌ Already exists';return;}let u=db.ref('users').push();await u.set({name:n,email:e,pass:btoa(p),gender:gender,dob:dob,day:day,month:month,year:year,age:age,created:Date.now(),streak:0});document.getElementById('authStatus').innerText='✅ Created! Login now';toggleAuth();}
async function login(){let e=document.getElementById('loginEmail').value.trim().toLowerCase(),p=document.getElementById('loginPass').value;if(e==='admin@iitm.com'&&p==='admin123'){currentUser={name:'Gaurav Gupta',email:e};isAdmin=true;localStorage.setItem('iitm_user',JSON.stringify(currentUser));localStorage.setItem('iitm_admin','true');showApp();return;}let s=await db.ref('users').orderByChild('email').equalTo(e).once('value');if(!s.exists()){document.getElementById('authStatus').innerText='❌ Not found';return;}let f=null;s.forEach(c=>{let d=c.val();d._key=c.key;if(atob(d.pass)===p)f=d;});if(!f){document.getElementById('authStatus').innerText='❌ Wrong password';return;}currentUser=f;localStorage.setItem('iitm_user',JSON.stringify(currentUser));localStorage.setItem('iitm_userKey',f._key);showApp();}
function googleLogin(){let provider=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(provider).then(async res=>{let u=res.user;let email=u.email.toLowerCase();let name=u.displayName;let photo=u.photoURL;let snap=await db.ref('users').orderByChild('email').equalTo(email).once('value');let key=null;if(!snap.exists()){let nu=db.ref('users').push();await nu.set({name:name,email:email,pass:'google',photo:photo,created:Date.now(),streak:0});key=nu.key;}else{snap.forEach(c=>{key=c.key;});}currentUser={name:name,email:email};localStorage.setItem('iitm_user',JSON.stringify(currentUser));localStorage.setItem('iitm_userKey',key);localStorage.setItem('iitm_userPhoto',photo);showApp();}).catch(e=>{document.getElementById('authStatus').innerText='❌ '+e.message;});}
function showApp(){let u=JSON.parse(localStorage.getItem('iitm_user')||'null');if(u){currentUser=u;isAdmin=localStorage.getItem('iitm_admin')==='true';}if(!currentUser)return;document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');let photo=localStorage.getItem('iitm_userPhoto');if(photo){let img=document.getElementById('userPhoto');if(img){img.src=photo;img.style.display='block';}}loadData();}
function logout(){localStorage.clear();location.reload();}
function loadData(){}
window.onload=()=>{let u=localStorage.getItem('iitm_user');if(u){currentUser=JSON.parse(u);isAdmin=localStorage.getItem('iitm_admin')==='true';showApp();}};

// PROFILE
function openProfile(){let u=JSON.parse(localStorage.getItem('iitm_user')||'{}');document.getElementById('profileEmail').innerText=u.email||'';document.getElementById('pName').value=u.name||'';let pic=localStorage.getItem('iitm_userPhoto')||'https://ui-avatars.com/api/?name='+encodeURIComponent(u.name||'User');document.getElementById('profilePic').src=pic;db.ref('users').orderByChild('email').equalTo((u.email||'').toLowerCase()).once('value').then(snap=>{snap.forEach(c=>{let d=c.val();document.getElementById('pGender').value=d.gender||'';document.getElementById('pDay').value=d.day||'';document.getElementById('pMonth').value=d.month||'';document.getElementById('pYear').value=d.year||'';document.getElementById('pAge').value=d.age||'';document.getElementById('pBio').value=d.bio||'';});});document.getElementById('profileModal').classList.add('open');}
function closeProfile(){document.getElementById('profileModal').classList.remove('open');}
async function saveProfile(){let name=document.getElementById('pName').value.trim();let gender=document.getElementById('pGender').value;let day=document.getElementById('pDay').value;let month=document.getElementById('pMonth').value;let year=document.getElementById('pYear').value;let age=document.getElementById('pAge').value;let bio=document.getElementById('pBio').value.trim();if(!name){document.getElementById('profileStatus').innerText='❌ Name required';return;}let email=(JSON.parse(localStorage.getItem('iitm_user')||'{}').email||'').toLowerCase();let key=localStorage.getItem('iitm_userKey');let u=JSON.parse(localStorage.getItem('iitm_user')||'{}');u.name=name;localStorage.setItem('iitm_user',JSON.stringify(u));if(key){await db.ref('users/'+key).update({name:name,gender:gender,dob:day+'/'+month+'/'+year,day:day,month:month,year:year,age:age,bio:bio});}document.getElementById('profileStatus').innerText='✅ Saved!';setTimeout(closeProfile,800);}

// OTP SYSTEM - FINAL
function openOTP(){let e=document.getElementById('loginEmail').value.trim();if(e) document.getElementById('resetEmail').value=e;document.getElementById('otpModal').classList.add('open');document.getElementById('otpStep1').classList.remove('hidden');document.getElementById('otpStep2').classList.add('hidden');document.getElementById('otpStatus').innerText='';}
function closeOTP(){document.getElementById('otpModal').classList.remove('open');}
function sendOTP(){
 let email=document.getElementById('resetEmail').value.trim().toLowerCase();
 if(!email){document.getElementById('otpStatus').innerText='❌ Email daal';return;}
 document.getElementById('sendBtn').innerText='⏳ Sending...';document.getElementById('sendBtn').disabled=true;
 db.ref('users').orderByChild('email').equalTo(email).once('value').then(snap=>{
  if(!snap.exists() && email!=='admin@iitm.com'){document.getElementById('otpStatus').innerText='❌ Not found';document.getElementById('sendBtn').innerText='Send OTP 📨';document.getElementById('sendBtn').disabled=false;return;}
  let otp=Math.floor(100000+Math.random()*900000).toString();
  let expiry=Date.now()+5*60*1000;
  let safeEmail=email.replace(/\./g,'_').replace(/@/g,'_at_');
  db.ref('password_resets/'+safeEmail).set({email:email,otp:otp,expiry:expiry}).then(()=>{
   try{
     emailjs.send("service_iitm","template_otp",{to_email:email,otp:otp}).then(()=>{
       document.getElementById('otpStatus').innerHTML=`✅ OTP sent to <b>${email}</b>`;
     }).catch(()=>{
       document.getElementById('otpStatus').innerHTML=`✅ Demo OTP: <b style="color:#22c55e;font-size:20px">${otp}</b><br><small>EmailJS key lagane pe email pe jayega</small>`;
     });
   }catch(err){
     document.getElementById('otpStatus').innerHTML=`✅ Demo OTP: <b style="color:#22c55e;font-size:20px">${otp}</b>`;
     alert(`OTP for ${email}: ${otp}`);
   }
   document.getElementById('otpStep1').classList.add('hidden');document.getElementById('otpStep2').classList.remove('hidden');
   document.getElementById('sendBtn').innerText='Send OTP 📨';document.getElementById('sendBtn').disabled=false;
   let t=300;let timer=setInterval(()=>{t--;let m=Math.floor(t/60),s=t%60;let el=document.getElementById('otpTimer');if(el)el.innerText=`⏳ ${m}:${String(s).padStart(2,'0')} left`;if(t<=0){clearInterval(timer);if(el)el.innerText='❌ Expired';}},1000);
  });
 });
}
function verifyAndReset(){
 let email=document.getElementById('resetEmail').value.trim().toLowerCase();
 let otpIn=document.getElementById('otpInput').value.trim();
 let newPass=document.getElementById('newPassInput').value.trim();
 if(otpIn.length!==6||newPass.length<6){document.getElementById('otpStatus').innerText='❌ OTP 6 digit + Pass 6+ char';return;}
 let safeEmail=email.replace(/\./g,'_').replace(/@/g,'_at_');
 db.ref('password_resets/'+safeEmail).once('value').then(snap=>{
  if(!snap.exists()){document.getElementById('otpStatus').innerText='❌ No OTP';return;}
  let d=snap.val();if(Date.now()>d.expiry){document.getElementById('otpStatus').innerText='❌ Expired, resend kar';return;}
  if(d.otp!==otpIn){document.getElementById('otpStatus').innerText='❌ Wrong OTP';return;}
  if(email==='admin@iitm.com'){document.getElementById('otpStatus').innerText='❌ Admin cant reset';return;}
  db.ref('users').orderByChild('email').equalTo(email).once('value').then(uSnap=>{
   uSnap.forEach(child=>{db.ref('users/'+child.key).update({pass:btoa(newPass)}).then(()=>{db.ref('password_resets/'+safeEmail).remove();document.getElementById('otpStatus').innerText='✅ Reset done! Login karo';setTimeout(()=>{closeOTP();document.getElementById('authStatus').innerText='✅ Pass changed, login now';},1200);});});
  });
 });
}

async function askAI(){let q=document.getElementById('aiInput').value.trim();if(!q)return;let box=document.getElementById('aiBox');box.innerHTML+=`<div style="align-self:flex-end;background:linear-gradient(90deg,#38bdf8,#8b5cf6);padding:8px 12px;border-radius:12px;font-size:12px">${q}</div>`;document.getElementById('aiInput').value='';try{let res=await fetch('https://ai.hackclub.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'qwen/qwen3-32b',messages:[{role:'user',content:q}]})});let data=await res.json();let ans=data.choices?.[0]?.message?.content||'No answer';box.innerHTML+=`<div style="background:#1a2340;padding:8px 12px;border-radius:12px;font-size:12px">${ans}</div>`;}catch(e){box.innerHTML+=`<div style="background:#1a2340;padding:8px 12px;border-radius:12px">Error</div>`;}}
</script></body></html>
