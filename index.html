*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}body{background:#060a18;color:#e2e8f0;overflow-x:hidden}:root{--p:#38bdf8;--p2:#8b5cf6;--card:#0f172a;--card2:#151f3a;--border:#1e293b}

{display:none!important}}#menuDrawer{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:none}#menuDrawer.open{display:block}.drawer-content{position:absolute;bottom:0;left:0;right:0;background:#0f172a;border-radius:28px 28px 0 0;padding:20px 16px 30px;border-top:1px solid rgba(255,255,255,.1);max-height:75vh;overflow-y:auto}.drawer-item{display:flex;align-items:center;gap:14px;padding:16px;background:#151f3a;border-radius:14px;margin-bottom:10px;cursor:pointer;border:1px solid rgba(255,255,255,.05)}.drawer-handle{width:40px;height:4px;background:rgba(255,255,255,.2);border-radius:10px;margin:0 auto 16px}.admin-stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.stat-box{background:#0f172a;padding:16px;border-radius:16px;text-align:center;border:1px solid rgba(255,255,255,.05)}.stat-box h2{font-size:24px}#profileModal,#otpModal,#signupOtpModal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px}#profileModal.open,#otpModal.open{display:flex}
</style>

<body>

<div id="loginForm" style="margin-top:20px"><button onclick="googleLogin()" style="width:100%;background:white;color:black;padding:13px;border-radius:14px;border:none;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px"><img src="https://www.svgrepo.com/show/475656/google-color.svg" style="width:20px"> Continue with Google</button><div style="text-align:center;margin:14px 0;opacity:.3;font-size:11px;display:flex;align-items:center;gap:10px"><div style="flex:1;height:1px;background:rgba(255,255,255,.2)"></div>OR<div style="flex:1;height:1px;background:rgba(255,255,255,.2)"></div></div><input id="loginEmail" placeholder="📧 Email"><input id="loginPass" type="password" placeholder="🔒 Password"><button onclick="login()" style="width:100%;background:linear-gradient(90deg,#38bdf8,#8b5cf6);color:white;padding:15px;border-radius:14px;border:none;font-weight:800;margin-top:12px">Login →</button><p style="margin-top:16px;text-align:center"><span onclick="openOTP()" style="color:#ef4444;cursor:pointer;font-weight:800;background:rgba(239,68,68,.12);padding:8px 16px;border-radius:20px;border:1px solid rgba(239,68,68,.2);font-size:12px;display:inline-block">🔑 Forgot Password? OTP Reset</span></p><p style="margin-top:12px;font-size:12px;text-align:center;opacity:.7">New? <span onclick="toggleAuth()" style="color:#38bdf8;cursor:pointer;font-weight:700">Create Account</span></p></div>

<input id="regName" placeholder="👤 Full Name">
<input id="regEmail" placeholder="📧 Email ID">

<select id="regGender"><option value="">👤 Select Gender</option><option>Male</option><option>Female</option><option>Other</option></select>

<button onclick="register()" style="width:100%;background:linear-gradient(90deg,#22c55e,#16a34a);color:white;padding:15px;border-radius:14px;border:none;font-weight:800;margin-top:12px">Create Account - Send OTP ✨</button>
<p style="margin-top:16px;font-size:12px;text-align:center;opacity:.7">Have account? <span onclick="toggleAuth()" style="color:#38bdf8;cursor:pointer;font-weight:700">Login</span></p></div>
<p id="authStatus" style="font-size:11px;margin-top:14px;text-align:center"></p></div></div>

<!-- SIGNUP OTP MODAL -->
<div id="signupOtpModal" style="position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;display:none;align-items:center;justify-content:center;padding:16px">
  <div style="background:#0f172a;border:1px solid #1e293b;border-radius:22px;padding:24px;max-width:380px;width:100%">
    <div style="display:flex;justify-content:space-between"><h3>📧 Verify OTP</h3><button onclick="closeSignupOtp()" style="background:#1e293b;color:white;border:none;padding:6px 12px;border-radius:20px">✕</button></div>
    <p style="font-size:11px;color:#94a3b8;margin-top:10px">OTP sent to <b id="signupOtpEmailText" style="color:#38bdf8"></b></p>
    <input id="signupOtpInput" maxlength="6" placeholder="••••••" style="text-align:center;letter-spacing:14px;font-size:28px;font-weight:900;margin-top:16px;border:2px solid #38bdf8">
    <button onclick="verifySignupOTP()" style="width:100%;background:linear-gradient(90deg,#22c55e,#16a34a);color:white;padding:14px;border-radius:12px;border:none;font-weight:800;margin-top:16px">Verify & Direct Login 🚀</button>
    <button onclick="resendSignupOTP()" style="width:100%;background:#1e293b;color:#38bdf8;padding:10px;border-radius:10px;border:none;margin-top:8px;font-size:12px">Resend OTP 🔄</button>

<div id="mainApp" class="hidden">[YOUR MAIN APP HTML SAME AS BEFORE - KEEP IT AS IS]</div>

<script>
// keep your firebase config same
const firebaseConfig={apiKey:"AIzaSyDSt8H43XQZFUF7MRuIqDq8Cdk4ZClwEDc",authDomain:"iitm-solutions.firebaseapp.com",databaseURL:"https://iitm-solutions-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"iitm-solutions",storageBucket:"iitm-solutions.firebasestorage.app",messagingSenderId:"411649171402",appId:"1:411649171402:web:e5278ba01a518080b0b933"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const auth=firebase.auth();
emailjs.init({publicKey:"0g35NzGfXah-1DMhS"});const SERVICE_ID="service_q3nz8on",TEMPLATE_ID="template_otvm3vh";
let currentUser=null,isAdmin=false,sec=parseInt(localStorage.getItem('sec')||0),iv=null,allSols=[],allPYQ=[],allNotes=[],currentBoardFilter='total',startTimestamp=0,wakeLock=null,allLeaderData=[],studyingCache={},isPaused=false,adLoaded=false;
let editPYQId=null,editNoteId=null,editSolId=null,allTickets=[],bookmarks=JSON.parse(localStorage.getItem('bookmarks')||'[]'),lastChatCount=0,lastPYQCount=parseInt(localStorage.getItem('lastPYQCount')||'0');
let pendingSignupData=null;

function toggleAuth(){document.getElementById('loginForm').classList.toggle('hidden');document.getElementById('signupForm').classList.toggle('hidden');}
(function(){['regDay','pDay'].forEach(id=>{let el=document.getElementById(id);if(!el)return;el.innerHTML='<option value="">Day</option>';for(let i=1;i<=31;i++){let o=document.createElement('option');o.value=i;o.text=i;el.appendChild(o);}});['regYear','pYear'].forEach(id=>{let el=document.getElementById(id);if(!el)return;el.innerHTML='<option value="">Year</option>';for(let i=2008;i>=1975;i--){let o=document.createElement('option');o.value=i;o.text=i;el.appendChild(o);}});})();

// NEW REGISTER WITH OTP DIRECT LOGIN
async function register(){
  let n=document.getElementById('regName').value.trim(),
      e=document.getElementById('regEmail').value.trim().toLowerCase(),
      p=document.getElementById('regPass').value,
      cp=document.getElementById('regConfirmPass').value;
  let g=document.getElementById('regGender').value,
      d=document.getElementById('regDay').value,
      m=document.getElementById('regMonth').value,
      y=document.getElementById('regYear').value;
  
  if(!n||!e||!p||!cp){document.getElementById('authStatus').innerText='❌ Fill Name, Email, New Pass, Confirm Pass';return;}
  if(p!==cp){document.getElementById('authStatus').innerText='❌ Password and Confirm not matching';return;}
  if(p.length<6){document.getElementById('authStatus').innerText='❌ Min 6 chars password';return;}
  
  let s=await db.ref('users').orderByChild('email').equalTo(e).once('value');
  if(s.exists()){document.getElementById('authStatus').innerText='❌ Email exists';return;}
  
  pendingSignupData={name:n,email:e,pass:p,gender:g,day:d,month:m,year:y,dob:d&&m&&y?d+'/'+m+'/'+y:''};
  await sendSignupOTP(e);
}

async function sendSignupOTP(email){
  document.getElementById('signupOtpModal').style.display='flex';
  document.getElementById('signupOtpEmailText').innerText=email;
  document.getElementById('signupOtpStatus').innerText='⏳ Sending OTP...';
  document.getElementById('signupOtpStatus').style.color='#facc15';
  let otp=Math.floor(100000+Math.random()*900000).toString();
  let safe=email.replace(/\./g,'_').replace(/@/g,'_at_');
  await db.ref('signup_otps/'+safe).set({email,otp,expiry:Date.now()+300000,time:Date.now()});
  try{
    await emailjs.send(SERVICE_ID,TEMPLATE_ID,{to_email:email,to_name:pendingSignupData.name,otp:otp,from_name:'IITM SOLUTIONS',email:email,message:`Your OTP is ${otp}`});
    document.getElementById('signupOtpStatus').innerText='✅ OTP sent to Gmail - check inbox & spam';
    document.getElementById('signupOtpStatus').style.color='#22c55e';
  }catch(err){
    document.getElementById('signupOtpStatus').innerHTML=`DEV OTP: <b style="color:#22c55e;font-size:22px">${otp}</b><br><small>EmailJS failed - use this</small>`;
  }
}
function closeSignupOtp(){document.getElementById('signupOtpModal').style.display='none';}
async function resendSignupOTP(){if(pendingSignupData) await sendSignupOTP(pendingSignupData.email);}
async function verifySignupOTP(){
  let oi=document.getElementById('signupOtpInput').value.trim();
  if(oi.length!=6){document.getElementById('signupOtpStatus').innerText='❌ Enter 6 digit OTP';return;}
  let safe=pendingSignupData.email.replace(/\./g,'_').replace(/@/g,'_at_');
  let snap=await db.ref('signup_otps/'+safe).once('value');
  if(!snap.exists()){document.getElementById('signupOtpStatus').innerText='❌ OTP not found';return;}
  let d=snap.val();
  if(Date.now()>d.expiry){document.getElementById('signupOtpStatus').innerText='❌ OTP Expired';return;}
  if(d.otp!==oi){document.getElementById('signupOtpStatus').innerText='❌ Wrong OTP';return;}
  // CREATE AND DIRECT LOGIN
  let u=db.ref('users').push();
  let newUser={name:pendingSignupData.name,email:pendingSignupData.email,pass:btoa(pendingSignupData.pass),gender:pendingSignupData.gender||'',day:pendingSignupData.day||'',month:pendingSignupData.month||'',year:pendingSignupData.year||'',dob:pendingSignupData.dob||'',created:Date.now(),streak:0,profileComplete:true};
  await u.set(newUser);
  await db.ref('signup_otps/'+safe).remove();
  newUser._key=u.key;
  currentUser=newUser;
  localStorage.setItem('iitm_user',JSON.stringify(currentUser));
  localStorage.setItem('iitm_userKey',u.key);
  localStorage.setItem('iitm_profile_done','true');
  closeSignupOtp();
  document.getElementById('signupOtpInput').value='';
  pendingSignupData=null;
  showApp(); // DIRECT LOGIN
}

// keep rest of your functions login, googleLogin, showApp etc same as your file
</script>
